; REII ESP groundstation dongle (NodeMCU-32S) — PlatformIO project.
; Reuses the verified RF bench pattern (RF24 + 32-B static payload) without mutating
; project_sources/02_increment_2/rf_characterisation/firmware/.
; Open this folder in VS Code (PlatformIO IDE) to build/flash.
; Groundstation = NodeMCU-32S (D-08). STM32 scrapped (D-09, FACT).

[platformio]
default_envs = groundstation_nodemcu32s

[env]
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_filters = send_on_enter
lib_deps =
    nrf24/RF24@^1.4.9
build_flags =
    -Wall
    -DGROUNDSTATION_VERSION=\"0.1.0\"

[env:groundstation_nodemcu32s]
platform = espressif32
board = nodemcu-32s
build_flags = ${env.build_flags}
