; REII ground station - ESP32-C3 + nRF24L01+ (Increment 4, spare for the NodeMCU-32S)
;
; Same firmware and serial protocol as ..\groundstation_PIO (v4.1.0); only the
; board pins change (include\gs_config.h, BOARD_ESP32C3). Boots straight into
; the ICD Normal Crane Control Mode (ch 77 / 2 Mbps / PA LOW / ICD profile).
;
;   pio run -e groundstation_esp32c3 -t upload
;   pio device monitor -e groundstation_esp32c3
;
; COM9 was the C3's port in Increment 2. Check Device Manager and change the
; two *_port lines if Windows gives it another number.

[platformio]
default_envs = groundstation_esp32c3

; ---------------------------------------------------------------------------
; Boards with native USB only (C3 SuperMini, DevKitM-1 USB port, XIAO-C3):
; shows up as "USB JTAG/serial debug unit" / USB Serial Device, VID:PID 303A:1001.
; This is the board used in Increment 2 (tx_esp32c3).
; ---------------------------------------------------------------------------
[env:groundstation_esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
lib_deps =
    nrf24/RF24@^1.6.2
build_flags =
    -Wall
    -DBOARD_ESP32C3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
upload_port = COM9
monitor_port = COM9
monitor_speed = 115200
monitor_echo = yes
monitor_filters = send_on_enter
; DTR/RTS low so opening the monitor never resets the board or puts it in download mode
monitor_dtr = 0
monitor_rts = 0

; ---------------------------------------------------------------------------
; Only for C3 boards with a CH340 / CP2102 USB-UART chip on GPIO20/21
; (Serial = UART0, shows up as "USB-SERIAL CH340" / "CP210x").
; ---------------------------------------------------------------------------
[env:groundstation_esp32c3_uart]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
lib_deps =
    nrf24/RF24@^1.6.2
build_flags =
    -Wall
    -DBOARD_ESP32C3
upload_port = COM9
monitor_port = COM9
monitor_speed = 115200
monitor_echo = yes
monitor_filters = send_on_enter
