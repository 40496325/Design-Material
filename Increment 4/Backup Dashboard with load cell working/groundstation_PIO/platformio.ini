; REII ground station - NodeMCU-32S + nRF24L01+ (Increment 4)
;
; USB serial bridge between the PC (dashboard / smoke_test.py) and the crane
; over the nRF24 link, ICD v1 IF10.0. Radio setup follows the Increment 2
; RX node (same pins, same RF24 library), boots straight into the ICD
; Normal Crane Control Mode (ch 77 / 2 Mbps).
;
;   pio run -e groundstation_nodemcu32s -t upload
;   pio device monitor -e groundstation_nodemcu32s

[platformio]
default_envs = groundstation_nodemcu32s

[env:groundstation_nodemcu32s]
platform = espressif32
board = nodemcu-32s
framework = arduino
lib_deps =
    nrf24/RF24@^1.6.2
build_flags =
    -Wall
upload_port = COM10
monitor_port = COM10
monitor_speed = 115200
monitor_echo = yes
monitor_filters = send_on_enter

; ---------------------------------------------------------------------------
; CROSS-CHECK ONLY - NOT the crane firmware.
; Runs this RF24 code on the ESP32-S3 crane board (COM12) with the crane's
; J1 / J7.10 wiring, listening as the crane on 'REII2'. If the crane radio
; works with this but not with crane_rig_IDF, the ESP-IDF firmware is at
; fault; if it is deaf with this too, the crane hardware is.
;   pio run -e crane_rf24_check -t upload
; ---------------------------------------------------------------------------
[env:crane_rf24_check]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps =
    nrf24/RF24@^1.6.2
build_flags =
    -Wall
    -DBOARD_CRANE_S3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
upload_port = COM12
monitor_port = COM12
monitor_speed = 115200
monitor_echo = yes
monitor_filters = send_on_enter
