; REII nRF24L01 link characterisation firmware
;
; One code base, role and board chosen per environment:
;   -DROLE_RX       ground-station stand-in, PC-tethered test master (+ LISTEN bring-up mode)
;   -DROLE_TX       mobile transmitter (+ BEACON bring-up mode)
;   -DROLE_SCANNER  126-channel RPD sweep + ESP32 WiFi AP scan (ESP32 only)
;   -DBOARD_*       pin map, see lib/linktest/board_pins.h
;
;   pio run -e rx_nodemcu32s -t upload
;   pio run -e tx_esp32c3 -t upload
;   pio device monitor -b 115200

[platformio]
default_envs = rx_nodemcu32s, tx_esp32c3

[env]
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_filters = send_on_enter
lib_deps =
    nrf24/RF24@^1.4.9
build_flags =
    -Wall
    -DLINKTEST_VERSION=\"0.1.0\"

; ---------------------------------------------------------------- NodeMCU-32S
[env:rx_nodemcu32s]
platform = espressif32
board = nodemcu-32s
build_flags = ${env.build_flags} -DROLE_RX -DBOARD_NODEMCU32S
upload_port = COM10
monitor_port = COM10

[env:scanner_nodemcu32s]
platform = espressif32
board = nodemcu-32s
build_flags = ${env.build_flags} -DROLE_SCANNER -DBOARD_NODEMCU32S

; the NodeMCU can also be the transmitter if the C3 board is unavailable
[env:tx_nodemcu32s]
platform = espressif32
board = nodemcu-32s
build_flags = ${env.build_flags} -DROLE_TX -DBOARD_NODEMCU32S

; ---------------------------------------------------------------- ESP32-C3
; Boards with native USB only (DevKitM-1, "SuperMini", XIAO-C3): Serial goes over USB-CDC.
[env:tx_esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
build_flags = ${env.build_flags} -DROLE_TX -DBOARD_ESP32C3
    -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
upload_port = COM9
monitor_port = COM9
monitor_dtr = 0
monitor_rts = 0

; Boards with an external USB-UART chip (CH340/CP2102) on GPIO20/21: plain UART0.
[env:tx_esp32c3_uart]
platform = espressif32
board = esp32-c3-devkitm-1
build_flags = ${env.build_flags} -DROLE_TX -DBOARD_ESP32C3
upload_port = COM9
monitor_port = COM9

; ---------------------------------------------------------------- Arduino Nano (fallback TX)
; Use 'nanoatmega328' for clones with the old bootloader (57600 baud upload).
[env:tx_nano]
platform = atmelavr
board = nanoatmega328new
build_flags = ${env.build_flags} -DROLE_TX -DBOARD_NANO
